# ca_app: speculative dockets_by_number probing.
# Cursors seeded from highest observed case numbers per court (source:
# SEED_HINTS dict in scraper.py and the "Courts Covered" table in CC_NOTES.md,
# highest_observed as of 2026-04-03). gap = 100 per source (largest_observed_gap
# was 100 for every court, 2026-04-03).
description = "ca_app — speculative maintenance (advancing cursors)"

[[schedules]]
# Once a week; adjust as needed.
cron = "0 6 * * 1"
timezone = "UTC"
active = true

[parameters]
seed_params = [
  { dockets_by_number = { docket_number = "[ca_app_scraper__cal]" } },
  { dockets_by_number = { docket_number = "[ca_app_scraper__calctapp_1st]" } },
  { dockets_by_number = { docket_number = "[ca_app_scraper__calctapp_2nd]" } },
  { dockets_by_number = { docket_number = "[ca_app_scraper__calctapp_3rd]" } },
  { dockets_by_number = { docket_number = "[ca_app_scraper__calctapp_4th_div1]" } },
  { dockets_by_number = { docket_number = "[ca_app_scraper__calctapp_4th_div2]" } },
  { dockets_by_number = { docket_number = "[ca_app_scraper__calctapp_4th_div3]" } },
  { dockets_by_number = { docket_number = "[ca_app_scraper__calctapp_5th]" } },
  { dockets_by_number = { docket_number = "[ca_app_scraper__calctapp_6th]" } },
]

[variables.ca_app_scraper__cal]
court_id = "cal"
min = 295928
soft_max = 295928
gap = 100
should_advance = true

