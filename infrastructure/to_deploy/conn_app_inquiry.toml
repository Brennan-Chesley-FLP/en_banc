# conn_app_inquiry: speculative dockets_by_internal_id probing (CRN).
# Cursors seeded from highest observed values (source: scraper.py entry-point
# docstring and CC_NOTES.md seed example
# `{"internal_id": {"min": 1, "soft_max": 105336, "gap": 500}}`).
description = "conn_app_inquiry — speculative maintenance (advancing cursors)"

[[schedules]]
# Once a week; adjust as needed.
cron = "0 6 * * 1"
timezone = "UTC"
active = true

[parameters]
# SHARED cursor: CaseDetail.aspx?CRN={n} probes an opaque internal CRN that is a
# SINGLE space shared across both appellate courts (conn + connappct); the court
# is read from the docket-number prefix (SC -> conn / AC -> connappct) at parse
# time. connsuperct (trial court) is not addressed by the speculation — it is
# reached by following the trial-court link off a civil appellate case. The
# entry takes only its SpeculativeRange (no court_ids), so one shared cursor
# covers everything.
seed_params = [
  { dockets_by_internal_id = { internal_id = "[conn_app_inquiry_scraper]" } },
]

# Shared cursor — covers conn + connappct (one CRN space; connsuperct reached via
# trial-court links off civil cases).
[variables.conn_app_inquiry_scraper]
min = 105336      # highest observed CRN (scraper.py docstring / CC_NOTES.md, as of 2026-06)
soft_max = 105336 # min == soft_max advance-window cursor (frontier maintenance)
gap = 500         # CRN gaps are large/irregular (hundreds) — source explicitly recommends a generous gap, far wider than the 10 default
should_advance = true
