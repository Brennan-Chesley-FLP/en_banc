# new_mexico_case_lookup: speculative dockets_by_number probing.
# Cursors seeded from highest observed values (source: CC_NOTES.md "Docket
# Number Formats" table, "Observed range" column).
#
# NmCourtRange carries only `court_id` (its court_type/court_location/
# case_category are read-only properties derived from court_id via
# COURT_CONFIG, NOT seedable fields), so there are no custom fields to fill —
# one cursor per court, continuous integer sequence (not year-partitioned).
#
# Seed values are the source's *approximate* high-water marks ("~N+"); a human
# should confirm exact current highs before enabling.
description = "new_mexico_case_lookup — speculative maintenance (advancing cursors)"
work_pool_name = "scraper-pool"
tags = ["en-banc", "scraper", "http", "court:nm", "court:nmctapp"]

[[schedules]]
# Once a week; adjust as needed.
rrule = "FREQ=WEEKLY;BYDAY=MO;BYHOUR=6;BYMINUTE=0;BYSECOND=0"
timezone = "UTC"
active = true

[parameters]
scraper_path = "juriscraper.state.new_mexico.caselookup_nmcourts_gov.scraper:NewMexicoCaseLookupScraper"
scraper_schema = "new_mexico_case_lookup"
seed_params = [
  { dockets_by_number = { docket_number = "[new_mexico_case_lookup_scraper__nm]" } },
  { dockets_by_number = { docket_number = "[new_mexico_case_lookup_scraper__nmctapp]" } },
]

# nm — NM Supreme Court (S-1-SC-{N}, continuous integer)
[variables.new_mexico_case_lookup_scraper__nm]
court_id = "nm"
min = 41000
soft_max = 41000
gap = 10
should_advance = true

# nmctapp — NM Court of Appeals (A-1-CA-{N}, continuous integer)
[variables.new_mexico_case_lookup_scraper__nmctapp]
court_id = "nmctapp"
min = 41500
soft_max = 41500
gap = 10
should_advance = true
