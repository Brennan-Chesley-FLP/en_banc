# vermont_portal: speculative dockets_by_number probing (YY-AP-NNN, YearlySpeculativeRange).
# Cursors seeded from highest observed values (source: CC_NOTES.md — exact
# docket lookup "verified 24-AP-121, 26-AP-140"; 26-AP-140 is the highest 2026
# number documented). No source gap override, so the gap=10 default is used.
description = "vermont_portal — speculative maintenance (advancing cursors)"
work_pool_name = "scraper-pool"
tags = ["en-banc", "scraper", "http", "court:vt"]

[[schedules]]
# Once a week; adjust as needed.
rrule = "FREQ=WEEKLY;BYDAY=MO;BYHOUR=6;BYMINUTE=0;BYSECOND=0"
timezone = "UTC"
active = true

[parameters]
scraper_path = "juriscraper.state.vermont.portal_vtcourts_gov.scraper:VermontPortalScraper"
scraper_schema = "vermont_portal"
# SINGLE court: Vermont has no intermediate appellate court; vt (Supreme Court)
# is the only court of last resort. The YearlySpeculativeRange has no court_id
# field and the entry takes only its speculative param (court "vt" is a
# constant), so one cursor covers it.
seed_params = [
  { dockets_by_number = { docket_number = "[vermont_portal_scraper]" } },
]

# Single cursor — covers vt (one YY-AP-NNN sequence per year).
[variables.vermont_portal_scraper]
year = 2026       # YearlySpeculativeRange: current partition year
min = 140         # 2026 leading edge 26-AP-140, verified (CC_NOTES.md)
soft_max = 140    # min == soft_max advance-window cursor (frontier maintenance)
gap = 10          # example default (no source-specific gap documented)
should_advance = true
# NOTE: 26-AP-140 is a verified-lookup value, not dated as the current ceiling;
# a human should confirm the latest 2026 number before deploying.
