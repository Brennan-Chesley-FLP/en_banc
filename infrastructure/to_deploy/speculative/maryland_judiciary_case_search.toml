# maryland_judiciary_case_search: speculative dockets_by_number probing.
# Cursors seeded from highest observed values (source: CC_NOTES.md "Docket
# Number Format" table — observed prefixes + the "ACM-REG-2024 confirmed up to
# 2520" note).
#
# Case numbers are {COURT3}-{TYPE3}-{NNNN}-{YYYY}; the space partitions by
# (court3, type3, year) and Kent speculates along the {NNNN} sequence. So we
# seed ONE cursor per (court3, type3) prefix, all year=2026 — five prefixes
# total, spanning both courts:
#   court3 = ACM -> mdctspecapp (Appellate Court of Maryland)
#   court3 = SCM -> md          (Supreme Court of Maryland)
# MdCaseRange (YearlySpeculativeRange + court3/type3) carries the prefix+year;
# court_id is a derived @property, not a stored field, so the variable tables
# carry court3/type3 and omit court_id.
#
# NOTE: the seeded highs are documented ~2024 annual volumes (ACM-REG is the
# only confidently-confirmed value, 2520); a human should re-seed with the
# actual highest observed 2026 sequence per prefix before deploy.
description = "maryland_judiciary_case_search — speculative maintenance (advancing cursors)"
work_pool_name = "browser-pool"
tags = ["en-banc", "scraper", "browser", "court:md", "court:mdctspecapp"]

[[schedules]]
# Once a week; adjust as needed.
rrule = "FREQ=WEEKLY;BYDAY=MO;BYHOUR=6;BYMINUTE=0;BYSECOND=0"
timezone = "UTC"
active = true

[parameters]
scraper_path = "juriscraper.state.maryland.casesearch_courts_state_md_us.scraper:MarylandJudiciaryCaseSearchScraper"
scraper_schema = "maryland_judiciary_case_search"
seed_params = [
  { dockets_by_number = { case_id = "[maryland_judiciary_case_search_scraper__ACM_REG]" } },
  { dockets_by_number = { case_id = "[maryland_judiciary_case_search_scraper__ACM_ALA]" } },
  { dockets_by_number = { case_id = "[maryland_judiciary_case_search_scraper__SCM_PET]" } },
  { dockets_by_number = { case_id = "[maryland_judiciary_case_search_scraper__SCM_MISC]" } },
  { dockets_by_number = { case_id = "[maryland_judiciary_case_search_scraper__SCM_REG]" } },
]

# gap = 30 follows the scraper docstring's seed example (accommodates the
# sparser SCM prefixes without prematurely stopping).

# ACM-REG = Appellate Court, Regular appeal (~2520/yr, confirmed) -> mdctspecapp
[variables.maryland_judiciary_case_search_scraper__ACM_REG]
min = 2520
soft_max = 2520
gap = 30
should_advance = true
year = 2026
court3 = "ACM"
type3 = "REG"

# ACM-ALA = Appellate Court, Application for Leave to Appeal (~1100+/yr) -> mdctspecapp
[variables.maryland_judiciary_case_search_scraper__ACM_ALA]
min = 1100
soft_max = 1100
gap = 30
should_advance = true
year = 2026
court3 = "ACM"
type3 = "ALA"

# SCM-PET = Supreme Court, Petition for Writ of Certiorari (~450/yr) -> md
[variables.maryland_judiciary_case_search_scraper__SCM_PET]
min = 450
soft_max = 450
gap = 30
should_advance = true
year = 2026
court3 = "SCM"
type3 = "PET"

# SCM-MISC = Supreme Court, Miscellaneous (~50/yr, approximate) -> md
[variables.maryland_judiciary_case_search_scraper__SCM_MISC]
min = 50
soft_max = 50
gap = 30
should_advance = true
year = 2026
court3 = "SCM"
type3 = "MISC"

# SCM-REG = Supreme Court, Regular matter (~20/yr, approximate) -> md
[variables.maryland_judiciary_case_search_scraper__SCM_REG]
min = 20
soft_max = 20
gap = 30
should_advance = true
year = 2026
court3 = "SCM"
type3 = "REG"
