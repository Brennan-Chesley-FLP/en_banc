# dc_court_of_appeals: weekly last-7-days maintenance (dockets_by_filing_date).
description = "dc_court_of_appeals — weekly last-7-days maintenance"

[[schedules]]
# Once a week; adjust day/time/timezone as needed.
cron = "0 6 * * 1"
timezone = "UTC"
active = true

[parameters]
seed_params = [
  { dockets_by_filing_date = { court_ids = ["dc"], date_range = "-7d" } },
]
