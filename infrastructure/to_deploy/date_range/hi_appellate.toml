# hi_appellate: weekly last-7-days maintenance (dockets_by_filing_date).
description = "hi_appellate — weekly last-7-days maintenance"
work_pool_name = "browser-pool"
work_queue_name = "hi_appellate"
concurrency_limit = 1
tags = ["en-banc", "scraper", "browser", "court:haw", "court:hawapp"]

[[schedules]]
# Once a week; adjust day/time/timezone as needed.
rrule = "FREQ=WEEKLY;BYDAY=MO;BYHOUR=6;BYMINUTE=0;BYSECOND=0"
timezone = "UTC"
active = true

[parameters]
scraper_path = "juriscraper.state.hawaii.jimspss1_courts_state_hi_us.scraper:HiAppellateScraper"
scraper_schema = "hi_appellate"
seed_params = [
  { dockets_by_filing_date = { court_ids = ["haw", "hawapp"], date_range = "-7d" } },
]
