# michigan_courts: weekly last-7-days maintenance (dockets_by_filing_date).
description = "michigan_courts — weekly last-7-days maintenance"
work_pool_name = "scraper-pool"
tags = ["en-banc", "scraper", "http", "court:mich", "court:michctapp"]

[[schedules]]
# Once a week; adjust day/time/timezone as needed.
rrule = "FREQ=WEEKLY;BYDAY=MO;BYHOUR=6;BYMINUTE=0;BYSECOND=0"
timezone = "UTC"
active = true

[parameters]
scraper_path = "juriscraper.state.michigan.courts_michigan_gov.scraper:MichiganCourtsScraper"
scraper_schema = "michigan_courts"
seed_params = [
  { dockets_by_filing_date = { court_ids = ["mich", "michctapp"], date_range = "-8d" } },
]
