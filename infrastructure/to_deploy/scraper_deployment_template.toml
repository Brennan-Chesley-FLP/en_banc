# Template for a new scraper deployment. Copy it, name the copy after the
# scraper's schema slug (e.g. ca_app.toml — the slug names the deployment and
# the S3 prefix), and fill in every <angle-bracket> value.
# Draft under infrastructure/to_deploy/<category>/; move the file into
# infrastructure/deployments/ to deploy it (each file there becomes one Prefect
# deployment on the next `pulumi up`).

description = "<schema> — <what this deployment does>"

# "browser-pool" if the scraper needs a live browser (FF_ALIKE / CHROME_ALIKE /
# JS_EVAL / captcha handlers — jkent's needs_browser predicate on the scraper
# class), else "scraper-pool". Must be one of those two.
work_pool_name = "scraper-pool"

# --- lane + concurrency (both optional) ---------------------------------------
# work_queue_name: which shared priority lane this deployment lands on. Defaults
# to "ongoing" (weekly maintenance). Other lanes: "high-priority", "backfill",
# and — scraper-pool only — the dedicated "pa_ujs_portal" /
# "south_carolina_appellate". Pulumi rejects a lane the pool doesn't serve.
# Leave it unset for a normal maintenance scrape.
# work_queue_name = "ongoing"

# concurrency_limit: per-deployment scheduling-layer concurrency. Defaults to 1,
# which serializes this scraper's runs (excess runs enqueue and wait). Keep it 1
# if the deployment advances speculative cursors — the finalize step has no
# monotonic cross-run guard and relies on runs being serialized.
# concurrency_limit = 1

# By convention: "en-banc", "scraper", the transport ("http" or "browser",
# matching work_pool_name), and one "court:<id>" per CourtListener court the
# scraper covers (the class's court_ids attribute).
tags = ["en-banc", "scraper", "http", "court:<court_id>"]

# --- optional scalars ---------------------------------------------------------
# version = "<label>"
# paused = false                    # default
# enforce_parameter_schema = true   # default
# [job_variables]                   # worker infrastructure overrides

[parameters]
# The scraper this deployment runs. scraper_schema must equal the filename stem.
scraper_path = "<module.path.to.scraper>:<ClassName>"
scraper_schema = "<schema>"
# seed_params: list of { entry_point = { kwargs } } tables. A whole-string
# "[key]" value resolves against the Prefect Variable of that name at seed
# time; declare each key's initial cursor under [variables.<key>] below.
# seed_params = [
#   { dockets_by_filing_date = { court_ids = ["<court_id>"], date_range = "-8d" } },
#   { dockets_by_number = { docket_number = "[<schema>_scraper__<court_id>]" } },
# ]

# --- optional run-tuning knobs -----------------------------------------------
# Omitting one takes en_banc's default, noted per knob. Most match jkent's own
# default; worker_ramp_interval and adaptive_rate_limit deliberately do not.
# continuation_workers: per-run continuation-worker pool size. jkent pins the
# pool at this size for the whole run (it is NOT a ramp-up cap). Omit to use the
# worker's MAX_CONTINUATION_WORKERS env var / default (10). jkent forces 1 for
# STRICTLY_SERIAL scrapers regardless.
# continuation_workers = 2

# worker_ramp_interval: seconds between worker spawns at startup. Shapes
# arrival, not capacity — the pool still reaches continuation_workers, it just
# doesn't open that many browser pages on the first tick. Default 30.0 (jkent's
# own default is 0.0 = all at once); set 0 to opt back into that.
# worker_ramp_interval = 0

# rate_limited: honor the scraper's declared rate_limits. Default true; false
# is for replay and other no-network runs, not for going faster.
# rate_limited = false

# adaptive_rate_limit: make the run's *default* rate-limit lane adaptive — it
# opens at the scraper's declared rate_limits and slows on server pushback. The
# scraper's other lanes are unaffected, and it's ignored when rate_limited is
# false. Default true (jkent's own default is false).
# adaptive_rate_limit = false

# max_persistent_errors: graceful-stop budget. jkent halts the run cleanly
# (DB finalized, resumable) once this many never-retried "persistent" failures
# have been stored. Omit for unlimited (jkent's default).
# max_persistent_errors = 50

# [parameters.circuit_breaker]: jkent's run-scoped circuit breaker over
# *transient* failures — one breaker shared by the whole worker pool, so the
# count is a run-global "the server is in distress" signal. When it trips, the
# pool pauses (requests aren't failed) until a probe succeeds. Any knob may
# be omitted to keep jkent's default. Omit the whole table for the default policy
# (threshold 8, 30s base cool-down escalating x2 up to 300s). Size the threshold
# against the pool: it must exceed continuation_workers by enough that one bad
# moment across every worker at once doesn't read as a downed server.
# [parameters.circuit_breaker]
# failure_threshold = 8        # consecutive pool-wide transient failures that trip it
# recovery_timeout = 30.0      # seconds paused before admitting one probe
# recovery_backoff = 2.0       # cool-down multiplier per failed probe (1.0 = fixed window)
# max_recovery_timeout = 300.0 # ceiling on the escalated cool-down

# Each [[schedules]] becomes one DeploymentSchedule. Set exactly one of
# cron / interval (seconds) / rrule; other allowed keys: timezone, active,
# slug, anchor_date, day_or, catchup, max_active_runs, max_scheduled_runs,
# and a per-schedule parameters table.
# [[schedules]]
# rrule = "FREQ=WEEKLY;BYDAY=SA;BYHOUR=20;BYMINUTE=0;BYSECOND=0"
# timezone = "America/Chicago"
# active = true

# Initial cursor for every "[key]" referenced from seed_params (required —
# `pulumi up` fails on an undeclared key). Pulumi creates the Variable once
# (ignore_changes on value); the scrape's finalize step advances it at runtime.
# Contents are the JSON the speculative range validates from; min == soft_max
# is the pure advance-window (frontier maintenance) convention.
# [variables.<schema>_scraper__<court_id>]
# court_id = "<court_id>"
# min = 1
# soft_max = 1
# gap = 10
# should_advance = true
