# texas_tames: weekly last-7-days maintenance (dockets_by_filing_date).
description = "texas_tames — weekly last-7-days maintenance"
work_pool_name = "scraper-pool"
tags = ["en-banc", "scraper", "http", "court:tex", "court:texapp", "court:texcrimapp"]

[[schedules]]
# Once a week; adjust day/time/timezone as needed.
rrule = "FREQ=WEEKLY;BYDAY=MO;BYHOUR=6;BYMINUTE=0;BYSECOND=0"
timezone = "UTC"
active = true

[parameters]
scraper_path = "juriscraper.state.texas.search_txcourts_gov.scraper:TexasTamesScraper"
scraper_schema = "texas_tames"
seed_params = [
  { dockets_by_filing_date = { court_ids = ["tex", "texapp", "texcrimapp"], date_range = "-7d" } },
]
