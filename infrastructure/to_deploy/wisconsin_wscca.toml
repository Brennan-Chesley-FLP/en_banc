# wisconsin_wscca: speculative dockets_by_number probing (YYYYAP######, YearlySpeculativeRange).
# Cursors seeded from highest observed values (source: CC_NOTES.md / scraper.py
# seed example, gap=20). NOTE: no "highest observed as of <date>" value is
# documented for any year — the seed examples use min=1, soft_max=4000 as a
# full-year enumeration ceiling, not an observed frontier — so min/soft_max are
# left as TODO placeholders (min = 1) per the contract fallback.
description = "wisconsin_wscca — speculative maintenance (advancing cursors)"

[[schedules]]
# Once a week; adjust as needed.
cron = "0 6 * * 1"
timezone = "UTC"
active = true

[parameters]
# SHARED cursor: the YYYYAP###### numbering is a SINGLE (year, AP-prefix) space
# threaded by both Wisconsin appellate courts (wis Supreme + wisctapp Court of
# Appeals, all four CA districts rolling up to wisctapp); the owning court is
# read per-response from the API courtType (SC/CA), never seeded. The
# speculative entry takes only its YearlySpeculativeRange (no court_ids), so one
# shared cursor covers both courts.
seed_params = [
  { dockets_by_number = { docket_number = "[wisconsin_wscca_scraper]" } },
]

# Shared cursor — covers wis + wisctapp (one YYYYAP###### space per year).
[variables.wisconsin_wscca_scraper]
year = 2026       # YearlySpeculativeRange: current partition year
min = 1           # TODO: seed highest observed (no frontier value in source)
soft_max = 1      # TODO: seed highest observed (no frontier value in source)
gap = 20          # source seed example uses gap=20 (wider than the 10 default)
should_advance = true
# NOTE: source documents no observed 2026 frontier; its seed example is a
# full-year walk {min:1, soft_max:4000, gap:20}. A human should seed
# min = soft_max to the current highest AP number before deploying (or switch
# to min=1 / soft_max~=4000 for an initial full backfill walk).
