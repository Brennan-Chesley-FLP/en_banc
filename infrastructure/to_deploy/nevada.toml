# nevada: speculative fetch_by_internal_id probing (csIID).
# Cursors seeded from highest observed values (source: scraper.py entry-point
# comment `# highest_observed=74595, largest_observed_gap=20 (2026-04-16)`
# and the module docstring stating a single shared csIID sequence).
description = "nevada — speculative maintenance (advancing cursors)"

[[schedules]]
# Once a week; adjust as needed.
cron = "0 6 * * 1"
timezone = "UTC"
active = true

[parameters]
# SHARED cursor: the C-Track site uses ONE csIID sequence shared across both
# Nevada courts (nev + nevapp); the court is derived from the docket-number
# suffix (`-COA` -> nevapp) at parse time. SpeculativeRange has no court field
# and the entry takes no court_ids arg, so a single shared cursor covers both.
seed_params = [
  { fetch_by_internal_id = { rid = "[nevada_scraper]" } },
]

# Shared cursor — covers both nev and nevapp (single csIID space).
[variables.nevada_scraper]
min = 74595       # highest_observed csIID as of 2026-04-16 (scraper.py)
soft_max = 74595  # min == soft_max advance-window cursor
gap = 20          # largest_observed_gap=20 (scraper.py); wider than the 10 default
should_advance = true
