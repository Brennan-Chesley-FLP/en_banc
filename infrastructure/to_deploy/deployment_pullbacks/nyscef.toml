# nyscef: weekly last-7-days maintenance (dockets_by_filing_date).
description = "nyscef — weekly last-7-days maintenance"
work_pool_name = "browser-pool"
tags = ["en-banc", "scraper", "browser", "court:nyappd1", "court:nyappd2", "court:nyappd3", "court:nyappd4", "court:nysctcl"]

[[schedules]]
# Once a week; adjust day/time/timezone as needed.
rrule = "FREQ=WEEKLY;BYDAY=TH;BYHOUR=20;BYMINUTE=0;BYSECOND=0"
timezone = "America/New_York"
active = true

[parameters]
scraper_path = "juriscraper.state.new_york.iapps_courts_state_ny_us.scraper:NYSCEFScraper"
scraper_schema = "nyscef"
seed_params = [
  { dockets_by_filing_date = { court_ids = ["nyappd1", "nyappd2", "nyappd3", "nyappd4"], date_range = "-8d" } },
]
