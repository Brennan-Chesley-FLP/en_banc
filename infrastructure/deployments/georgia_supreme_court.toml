# Special ongoing config needed.
# No dockets_by_filing_date / dockets_by_updated_date and no speculative entry
# was found for this scraper, so its ongoing-maintenance strategy needs to be
# designed by hand. Available entries: docket_by_number, dockets_by_bulk, dockets_since_number.
description = "georgia_supreme_court — special ongoing config needed"
work_pool_name = "scraper-pool"
tags = ["en-banc", "scraper", "http", "court:ga"]

[[schedules]]
# Once a week; adjust as needed.
rrule = "FREQ=WEEKLY;BYDAY=TU;BYHOUR=6;BYMINUTE=0;BYSECOND=0"
timezone = "UTC"
active = true

[parameters]
scraper_path = "juriscraper.state.georgia.pubdoc_gasupreme_us.scraper:GeorgiaSupremeCourtScraper"
scraper_schema = "georgia_supreme_court"
seed_params = [{"dockets_by_year" = {"court_ids" = ["ga"], "year" = 26}}]
