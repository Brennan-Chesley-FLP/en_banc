# mississippi_appellate: speculative dockets_by_internal_id probing (case_num).
# Cursors seeded from highest observed values (source: CC_NOTES.md — "leading
# edge near 100 500 in Q2 2025, growing ~10 000/year", observed range "roughly
# 1 - 110 000"; matches the scraper's own seed example `{"min": 100500,
# "gap": 20}`).
description = "mississippi_appellate — speculative maintenance (advancing cursors)"
work_pool_name = "scraper-pool"
tags = ["en-banc", "scraper", "http", "court:miss", "court:missctapp"]

[[schedules]]
# Once a week; adjust as needed.
rrule = "FREQ=WEEKLY;BYDAY=MO;BYHOUR=6;BYMINUTE=0;BYSECOND=0"
timezone = "UTC"
active = true

[parameters]
scraper_path = "juriscraper.state.mississippi.courts_ms_gov.scraper:MississippiAppellateScraper"
scraper_schema = "mississippi_appellate"
# SHARED cursor: build_docket.php is keyed by an internal sequential `case_num`
# that is a SINGLE space shared across both courts (miss + missctapp) and all
# case types; the court is derived from the docket-number suffix (-SCT -> miss /
# -COA -> missctapp) at parse time. The entry takes only its SpeculativeRange
# (no court_ids), so one shared cursor covers both courts.
seed_params = [
  { dockets_by_internal_id = { internal_id = "[mississippi_appellate_scraper]" } },
]

# Shared cursor — covers miss + missctapp (one unified case_num space).
[variables.mississippi_appellate_scraper]
min = 101240      # documented leading edge as of Q2 2025 (CC_NOTES.md)
soft_max = 101241 # min == soft_max advance-window cursor (frontier maintenance)
gap = 10          # source seed example uses gap=20 (wider than the 10 default)
should_advance = true
# NOTE: case_num grows ~10 000/year and CC_NOTES cites an observed range up to
# ~110 000; the 100 500 leading edge is dated Q2 2025, so a human should bump
# this toward the current frontier (~110 000+) before deploying.
