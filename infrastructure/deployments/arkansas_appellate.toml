description = "arkansas_appellate — special ongoing config needed"
work_pool_name = "scraper-pool"
tags = ["en-banc", "scraper", "http", "court:ark", "court:arkctapp"]


[[schedules]]
# Once a week; adjust day/time/timezone as needed.
rrule = "FREQ=WEEKLY;BYDAY=TH;BYHOUR=10;BYMINUTE=0;BYSECOND=0"
timezone = "America/Chicago"
active = true


[parameters]
scraper_path = "juriscraper.state.arkansas.caseinfo_arcourts_gov.scraper:ArkansasAppellateScraper"
scraper_schema = "arkansas_appellate"
seed_params = [
  { dockets_by_filing_date = { court_ids = ["ark","arkctapp"], date_range = "-8d" } },
]