# indiana_appellate: weekly last-7-days maintenance (dockets_by_filing_date).
description = "indiana_appellate — weekly last-7-days maintenance"
work_pool_name = "scraper-pool"
tags = ["en-banc", "scraper", "http", "court:ind", "court:indctapp", "court:indtc"]

[[schedules]]
# Once a week; adjust day/time/timezone as needed.
rrule = "FREQ=WEEKLY;BYDAY=MO;BYHOUR=6;BYMINUTE=0;BYSECOND=0"
timezone = "America/Chicago"
active = true

[parameters]
scraper_path = "juriscraper.state.indiana.mycase_courts_in_gov.scraper:IndianaAppellateScraper"
scraper_schema = "indiana_appellate"
seed_params = [
  { dockets_by_filing_date = { court_ids = ["ind", "indctapp", "indtc"], date_range = "-7d" } },
]
