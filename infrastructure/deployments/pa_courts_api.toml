# pa_courts_api: speculative dockets_by_number probing over the PACMS JSON API
# (services.pacourts.us). Complements pa_ujs_portal: structured case data
# here, PDFs there — both should run.
#
# Docket numbers are "<seq> <TYPE> <year>", with <seq> restarting at 1 each
# year within each of the 17 type prefixes (DOCKET_TYPES in models.py), so
# there is ONE cursor per (docket_type, year) — 17 cursors, all year = 2026.
# PaDocketRange carries court_id + docket_type + year; the year does NOT roll
# over, so 2027 cursors must be added (and 2026's retired) at the new year.
#
# Cursor seeds: the highest 2026 sequence seen in the scraper's test fixtures
# (search_supreme_smith.json / search_unfiltered_smith.json, 150-row "Smith"
# name searches captured 2026-09-08). Those are sparse samples, so each seed is
# a LOWER bound on the real frontier: the first run walks forward from it to
# the true high (nothing above is skipped), and cases below it are backfill,
# not maintenance. Prefixes with no 2026 number in the fixtures start at 1.
#
# gap = 25 per CC_NOTES.md: sequences are sparse (~1/3-1/2 resolve) with
# interior runs of 5+ misses, so a tight gap ends the walk early.
#
# RATE LIMIT: the API 429s hard and the block is IP-wide and outlasts an hour
# (scraper rate_limits = 1 req / 10 s, a guess, not a measurement). A throttled
# walk reads 429s as misses and ends ranges early. CC_NOTES.md says to prove a
# single (type, year) range walks cleanly before running a broad sweep like
# this one, so this deployment ships PAUSED. Unpause after that check.
description = "pa_courts_api — speculative maintenance (advancing cursors)"
work_pool_name = "scraper-pool"
tags = ["en-banc", "scraper", "http", "court:pa", "court:pacommwct", "court:pasuperct"]
paused = true

[[schedules]]
# Once a week; adjust as needed. Offset from pa_ujs_portal (WE) so the two
# AOPC scrapers don't run the same day.
rrule = "FREQ=WEEKLY;BYDAY=SA;BYHOUR=20;BYMINUTE=0;BYSECOND=0"
timezone = "America/New_York"
active = true

[parameters]
scraper_path = "juriscraper.state.pennsylvania.service_pacourts_us.scraper:PaCourtsApiScraper"
scraper_schema = "pa_courts_api"
seed_params = [
  # Supreme Court of Pennsylvania
  { dockets_by_number = { docket_number = "[pa_courts_api_scraper__pa__map]" } },
  { dockets_by_number = { docket_number = "[pa_courts_api_scraper__pa__eap]" } },
  { dockets_by_number = { docket_number = "[pa_courts_api_scraper__pa__wap]" } },
  { dockets_by_number = { docket_number = "[pa_courts_api_scraper__pa__mal]" } },
  { dockets_by_number = { docket_number = "[pa_courts_api_scraper__pa__eal]" } },
  { dockets_by_number = { docket_number = "[pa_courts_api_scraper__pa__wal]" } },
  { dockets_by_number = { docket_number = "[pa_courts_api_scraper__pa__mm]" } },
  { dockets_by_number = { docket_number = "[pa_courts_api_scraper__pa__em]" } },
  { dockets_by_number = { docket_number = "[pa_courts_api_scraper__pa__wm]" } },
  # Superior Court of Pennsylvania
  { dockets_by_number = { docket_number = "[pa_courts_api_scraper__pasuperct__eda]" } },
  { dockets_by_number = { docket_number = "[pa_courts_api_scraper__pasuperct__mda]" } },
  { dockets_by_number = { docket_number = "[pa_courts_api_scraper__pasuperct__wda]" } },
  { dockets_by_number = { docket_number = "[pa_courts_api_scraper__pasuperct__edm]" } },
  { dockets_by_number = { docket_number = "[pa_courts_api_scraper__pasuperct__mdm]" } },
  { dockets_by_number = { docket_number = "[pa_courts_api_scraper__pasuperct__wdm]" } },
  # Commonwealth Court of Pennsylvania
  { dockets_by_number = { docket_number = "[pa_courts_api_scraper__pacommwct__cd]" } },
  { dockets_by_number = { docket_number = "[pa_courts_api_scraper__pacommwct__md]" } },
]
# At 1 request / 10 s, extra workers only queue on the rate limiter.
continuation_workers = 1

# Pause the pool on a streak of transient failures (429s) instead of letting
# retries keep hitting a blocked IP. The penalty outlasted an hour in recon, so
# probe every 15 min rather than jkent's default 5.
[parameters.circuit_breaker]
failure_threshold = 3
recovery_timeout = 900.0

# --- Supreme Court of Pennsylvania ---------------------------------------------

# MAP = Middle District appeal (no 2026 number in fixtures)
[variables.pa_courts_api_scraper__pa__map]
court_id = "pa"
docket_type = "MAP"
year = 2026
min = 1
soft_max = 1
gap = 25
should_advance = true

