# pa_courts_api: weekly last-7-days maintenance (dockets_by_filing_date).
# Structured case data from the PACMS JSON API (services.pacourts.us).
# Complements pa_ujs_portal: structured case data here, PDFs there — both
# should run.
#
# CROSS-DOMAIN: this entry point is not purely a services.pacourts.us scrape.
# The JSON API refuses to search on a date range alone, so dockets_by_filing_date
# runs the *sibling portal's* filing-date search on ujsportal.pacourts.us as a
# docket-number oracle, then fetches each case in full from the API. One portal
# search per court enumerates a window exactly, where the old speculative walk
# only estimated it. See the scraper's CC_NOTES.md → "Cross-domain docket
# discovery".
#
# This replaces the previous speculative dockets_by_number sweep (17 advancing
# (docket_type, year) cursors). That walk could never distinguish "this sequence
# number doesn't exist" from "the numbers stop here", cost one request per
# candidate against an API that permits ~1 req/10 s, and — worst — read a
# throttled 429 as a miss, silently truncating ranges. The portal search has
# none of those failure modes. It remains available as a fallback and an
# independent cross-check; re-seeding it means restoring the [variables.*]
# cursor tables from this file's git history.
#
# RATE LIMIT: the API 429s hard and the block is IP-wide, outlasting an hour in
# recon (scraper rate_limits = 1 req / 10 s, a guess, not a measurement). Unlike
# the speculative walk, a throttled run here is *slow, not incomplete*: 429 is
# TRANSIENT, so requests retry rather than being read as missing data. The
# ceiling is run-global rather than per-host, so the portal searches and the
# case fetches compete for the same budget.
description = "pa_courts_api — weekly last-7-days maintenance"
work_pool_name = "scraper-pool"
tags = ["en-banc", "scraper", "http", "court:pa", "court:pacommwct", "court:pasuperct"]

[[schedules]]
# Once a week, offset from pa_ujs_portal (WE) so the two AOPC scrapers don't run
# the same day — now doubly relevant, since this one also hits the portal host.
rrule = "FREQ=WEEKLY;BYDAY=SA;BYHOUR=20;BYMINUTE=0;BYSECOND=0"
timezone = "America/New_York"
active = true

[parameters]
scraper_path = "juriscraper.state.pennsylvania.service_pacourts_us.scraper:PaCourtsApiScraper"
scraper_schema = "pa_courts_api"
seed_params = [
  { dockets_by_filing_date = { court_ids = ["pa", "pacommwct", "pasuperct"], date_range = "-8d" } },
]
# At 1 request / 10 s (run-global), extra workers only queue on the rate limiter.
continuation_workers = 1

# Pause the pool on a streak of transient failures instead of letting retries
# keep hitting a blocked IP — 429s from the API, and the portal's intermittent
# 400s, both land here. The penalty outlasted an hour in recon, so probe every
# 15 min rather than jkent's default 5.
[parameters.circuit_breaker]
failure_threshold = 3
recovery_timeout = 900.0
