# oregon: weekly last-7-days maintenance (dockets_by_filing_date).
description = "oregon — weekly last-7-days maintenance"
work_pool_name = "scraper-pool"
tags = ["en-banc", "scraper", "http", "court:or", "court:orctapp"]

[[schedules]]
# Once a week; adjust day/time/timezone as needed.
rrule = "FREQ=WEEKLY;BYDAY=SU;BYHOUR=6;BYMINUTE=0;BYSECOND=0"
timezone = "America/Los_Angeles"
active = true

[parameters]
scraper_path = "juriscraper.state.oregon.trportal_courts_oregon_gov.scraper:OregonScraper"
scraper_schema = "oregon"
seed_params = [
  { dockets_by_filing_date = { court_ids = ["or", "orctapp"], date_range = "-8d" } },
]
