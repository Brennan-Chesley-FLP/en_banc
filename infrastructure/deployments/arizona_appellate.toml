# arizona_appellate: weekly last-7-days maintenance (dockets_by_updated_date).
description = "arizona_appellate — weekly last-7-days maintenance"
work_pool_name = "scraper-pool"
work_queue_name = "arizona_appellate"
concurrency_limit = 1
tags = ["en-banc", "scraper", "http", "court:ariz", "court:arizctapp"]

[[schedules]]
# Every Sunday at 8:00 PM Phoenix time (America/Phoenix has no DST).
rrule = "FREQ=WEEKLY;BYDAY=SU;BYHOUR=20;BYMINUTE=0;BYSECOND=0"
timezone = "America/Phoenix"
active = true

[parameters]
scraper_path = "juriscraper.state.arizona.apps_azcourts_gov.scraper:ArizonaAppellateScraper"
scraper_schema = "arizona_appellate"
seed_params = [
  { dockets_by_updated_date = { court_ids = ["ariz", "arizctapp"], date_range = "-8d" } },
]
