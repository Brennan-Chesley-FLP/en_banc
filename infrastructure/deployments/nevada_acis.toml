# nevada_acis: weekly last-7-days maintenance (dockets_by_filing_date).
description = "nevada_acis — weekly last-7-days maintenance"
work_pool_name = "scraper-pool"
work_queue_name = "nevada_acis"
concurrency_limit = 1
tags = ["en-banc", "scraper", "http", "court:nev", "court:nevapp"]

[[schedules]]
# Once a week; adjust day/time/timezone as needed.
rrule = "FREQ=WEEKLY;BYDAY=MO;BYHOUR=6;BYMINUTE=0;BYSECOND=0"
timezone = "UTC"
active = true

[parameters]
scraper_path = "juriscraper.state.nevada.acis_nvcourts_gov.scraper:NevadaAcisScraper"
scraper_schema = "nevada_acis"
seed_params = [
  { dockets_by_filing_date = { court_ids = ["nev", "nevapp"], date_range = "-7d" } },
]
