services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: prefect
      POSTGRES_PASSWORD: prefect
      POSTGRES_DB: prefect
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prefect -d prefect"]
      interval: 5s
      timeout: 5s
      retries: 5

  prefect-server:
    image: prefecthq/prefect:3-python3.13
    restart: unless-stopped
    command: >
      bash -c "pip install prefect-aws && prefect server start --host 0.0.0.0"
    ports:
      - "4200:4200"
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://prefect:prefect@postgres:5432/prefect
      PREFECT_SERVER_API_HOST: 0.0.0.0
      PREFECT_UI_API_URL: /api
    depends_on:
      postgres:
        condition: service_healthy


  # Tailscale sidecar: owns a network namespace that the scraper and browser
  # workers join (network_mode: service:ts-sidecar), so ALL of their egress
  # leaves through the selected Tailscale exit node. Only these workers route
  # this way — postgres/prefect-server are untouched.
  #
  # Kernel networking (TUN) is required: userspace mode only exposes a SOCKS5
  # proxy, not transparent default-route egress for the shared netns. Hence
  # NET_ADMIN + /dev/net/tun + TS_USERSPACE=false. --exit-node-allow-lan-access
  # keeps the local docker network (RFC1918) directly reachable so the workers
  # can still talk to prefect-server; without it that traffic would be forced
  # through the exit node too and break.
  #
  # Switch exit nodes by changing TS_EXIT_NODE and recreating just this service:
  #   TS_EXIT_NODE=egress.tailXXXX.ts.net docker compose up -d ts-sidecar
  ts-sidecar:
    image: tailscale/tailscale:latest
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?set TS_AUTHKEY to a Tailscale auth key for the sidecar}
      TS_HOSTNAME: en-banc-egress
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
      TS_EXTRA_ARGS: --exit-node=${TS_EXIT_NODE:?set TS_EXIT_NODE, e.g. egress.tailXXXX.ts.net} --exit-node-allow-lan-access
    volumes:
      - tailscale_state:/var/lib/tailscale
    healthcheck:
      test: ["CMD", "tailscale", "status"]
      interval: 10s
      timeout: 5s
      retries: 6

  # HTTP scraper worker: serves the lean `scraper-pool` (no browser engine).
  # Built out-of-band — this image needs juriscraper/jkent as additional
  # build contexts, which compose builders (esp. podman -> classic
  # docker-compose) don't reliably support. Build it first (see
  # docker/Dockerfile.worker for the command).
  scraper-worker:
    image: en-banc-worker
    restart: unless-stopped
    # Give in-flight scrapes time to drain gracefully on stop before SIGKILL
    # (the entrypoint SIGUSR1s the flow-run subprocesses, which finish their
    # in-flight request and finalize their DBs for resume).
    stop_grace_period: 120s
    # Share the Tailscale sidecar's netns: all egress exits via the exit node.
    network_mode: "service:ts-sidecar"
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
      SCRAPER_RUNS_DIR: /app/runs
      WORKER_POOL_NAME: scraper-pool
      # Max flow runs this worker executes at once (one subprocess per run).
      # Override on the host: WORKER_CONCURRENCY=8 docker compose up
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
      # OpenTelemetry: off by default (jkent's spans/metrics stay no-ops). Enable
      # by pointing at an OTLP collector and clearing the disable flag, e.g.
      # OTEL_SDK_DISABLED=false OTEL_EXPORTER_OTLP_ENDPOINT=http://otel:4317
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_INSECURE: ${OTEL_EXPORTER_OTLP_INSECURE:-true}
      JKENT_OTEL_LOOP_MONITOR: ${JKENT_OTEL_LOOP_MONITOR:-1}
      JKENT_OTEL_SAMPLE_RATIO: ${JKENT_OTEL_SAMPLE_RATIO:-1}
      JKENT_OTEL_CONSOLE: ${JKENT_OTEL_CONSOLE:-1}
      MAX_CONTINUATION_WORKERS: ${MAX_CONTINUATION_WORKERS:-10}
    volumes:
      # Live code: shadow the baked-in copies with the host checkouts. Each
      # flow run is a fresh subprocess, so it imports whatever is here now.
      - ..:/app
      - ../../jkent:/src/jkent
      - ../../juriscraper:/src/juriscraper
      # Run DBs stay on a named volume (shadows /app/runs inside the bind).
      - worker_runs:/app/runs
    depends_on:
      prefect-server:
        condition: service_started
      ts-sidecar:
        condition: service_healthy

  # Browser scraper worker: serves `browser-pool` and runs scrapers that need a
  # live browser (FF_ALIKE/CHROME_ALIKE/JS_EVAL/captcha handlers). Uses the
  # browser-enabled image (built with --build-arg INSTALL_BROWSERS=1 and tagged
  # en-banc-worker-browser; see docker/Dockerfile.worker for the command) and
  # runs exactly one scrape at a time — a real browser is heavy, so concurrency
  # is pinned 1.
  #
  # Browsers run *headed* on Xvfb so jkent's CloudflareHandler can clear
  # Turnstile interstitials with an OS-level (xdotool) click: Turnstile ignores
  # synthetic input, and xdotool needs a mapped window, so a headless browser
  # cannot clear one at all. The entrypoint starts the shared display on
  # $DISPLAY; jkent's camoufox engine adds a private one per browser.
  browser-worker:
    image: en-banc-worker-browser
    restart: unless-stopped
    stop_grace_period: 120s
    # Firefox falls over on the default 64MB /dev/shm.
    shm_size: 1gb
    # Share the Tailscale sidecar's netns: all egress exits via the exit node.
    network_mode: "service:ts-sidecar"
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
      SCRAPER_RUNS_DIR: /app/runs
      WORKER_POOL_NAME: browser-pool
      # One browser scrape at a time. Not host-overridable: the single-scrape
      # constraint is the whole point of this worker.
      WORKER_CONCURRENCY: 1
      # Headed browsers on the Xvfb display (see above). The geometry is
      # visible to pages as screen.width/height, so keep it unremarkable.
      BROWSER_HEADLESS: "0"
      DISPLAY: ":99"
      SCREEN_GEOMETRY: 1920x1080x24
      # Telemetry, same knobs as the HTTP worker.
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_INSECURE: ${OTEL_EXPORTER_OTLP_INSECURE:-true}
      JKENT_OTEL_LOOP_MONITOR: ${JKENT_OTEL_LOOP_MONITOR:-1}
      JKENT_OTEL_SAMPLE_RATIO: ${JKENT_OTEL_SAMPLE_RATIO:-1}
      JKENT_OTEL_CONSOLE: ${JKENT_OTEL_CONSOLE:-1}
      MAX_CONTINUATION_WORKERS: ${MAX_CONTINUATION_WORKERS:-10}
    volumes:
      - ..:/app
      - ../../jkent:/src/jkent
      - ../../juriscraper:/src/juriscraper
      - browser_worker_runs:/app/runs
    depends_on:
      prefect-server:
        condition: service_started
      ts-sidecar:
        condition: service_healthy

volumes:
  postgres_data:
  worker_runs:
  browser_worker_runs:
  tailscale_state:
